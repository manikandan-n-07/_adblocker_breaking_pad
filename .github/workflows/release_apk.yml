name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Rename APK for release
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/breaking_pad_browser_${{ github.ref_name }}.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/breaking_pad_browser_latest.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: BREAKING PAD Browser ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/breaking_pad_browser_${{ github.ref_name }}.apk
            build/app/outputs/flutter-apk/breaking_pad_browser_latest.apk
            build/app/outputs/flutter-apk/app-release.apk
